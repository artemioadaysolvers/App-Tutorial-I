<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Calculadora</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="engine.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="Calculadora básica">
    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 11h1m3 0h1m3 0h0M8 15h1m3 0h1m3 0h0M8 18h1m3 0h1m3 0h0"/></svg>
        </span>
        <h1>Calculadora<span>BÁSICA Y SIN COMPLICACIONES</span></h1>
      </div>
      <span class="offline" title="Funciona sin conexión"><span aria-hidden="true"></span>Sin conexión</span>
    </header>

    <section class="display" aria-label="Pantalla de resultados">
      <p id="expression" class="expression" aria-label="Operación">Lista para calcular</p>
      <output id="result" class="result" aria-live="polite" aria-atomic="true">0</output>
      <p id="message" class="message" aria-live="polite">Un cálculo a la vez.</p>
    </section>

    <section id="keypad" class="keypad" aria-label="Teclado de la calculadora">
      <button type="button" data-key="clear" class="key utility clear" aria-label="Borrar todo">AC</button>
      <button type="button" data-key="sign" class="key utility" aria-label="Cambiar de signo">±</button>
      <button type="button" data-key="percent" class="key utility" aria-label="Porcentaje: dividir entre cien">%</button>
      <button type="button" data-key="/" class="key operator" aria-label="Dividir" aria-pressed="false">÷</button>
      <button type="button" data-key="7" class="key">7</button>
      <button type="button" data-key="8" class="key">8</button>
      <button type="button" data-key="9" class="key">9</button>
      <button type="button" data-key="*" class="key operator" aria-label="Multiplicar" aria-pressed="false">×</button>
      <button type="button" data-key="4" class="key">4</button>
      <button type="button" data-key="5" class="key">5</button>
      <button type="button" data-key="6" class="key">6</button>
      <button type="button" data-key="-" class="key operator" aria-label="Restar" aria-pressed="false">−</button>
      <button type="button" data-key="1" class="key">1</button>
      <button type="button" data-key="2" class="key">2</button>
      <button type="button" data-key="3" class="key">3</button>
      <button type="button" data-key="+" class="key operator" aria-label="Sumar" aria-pressed="false">+</button>
      <button type="button" data-key="backspace" class="key utility backspace" aria-label="Borrar último dígito">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-7-7 7-7Z"/><path d="m12 9 6 6m0-6-6 6"/></svg>
      </button>
      <button type="button" data-key="0" class="key">0</button>
      <button type="button" data-key="decimal" class="key" aria-label="Separador decimal">,</button>
      <button type="button" data-key="equals" class="key equals" aria-label="Calcular resultado">=</button>
    </section>

    <footer class="footer"><span class="footer-mark" aria-hidden="true">+</span> Lo simple también cuenta.<span class="keyboard-tip">Puedes usar el teclado</span></footer>
  </main>
</body>
</html>
